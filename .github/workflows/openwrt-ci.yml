name: Build openwrt for ironman

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README*'
      - 'doc/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        # 留空 = 只构建、不发布；填了 = 构建成功后由 publish job 自动建 tag 与 release。
        description: '构建成功后自动发布的版本号，如 v1.1.0；留空则只构建不发布'
        required: false
        type: string
        default: ''
      prerelease:
        description: '标记为预发布（不占用 Latest）'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # release 构建不自动取消，避免已完成的固件被中途打断。
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  TZ: Asia/Shanghai
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G

permissions:
  contents: read

jobs:
  build_openwrt:

    name: Build OpenWrt firmware

    runs-on: ubuntu-26.04
    timeout-minutes: 300

    if: github.event_name != 'pull_request'


    steps:

      - name: Check Server Performance
        run: |
          echo "警告⚠"
          echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
          echo -e "已知CPU型号（降序）：7763，8370C，8272CL，8171M，E5-2673 \n"
          echo "--------------------------CPU信息--------------------------"
          echo "CPU物理数量：$(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
          echo -e "CPU核心信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
          echo "--------------------------内存信息--------------------------"
          echo "已安装内存详细信息："
          free -h
          echo "--------------------------硬盘信息--------------------------"
          df -hT

      # 磁盘清理统一由下方的 "Free Disk Space (Ubuntu)" 步骤负责，
      # 避免多套策略互相抵消（详见该步骤注释）。

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record build provenance
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          echo "GITHUB_SHA=${GITHUB_SHA} HEAD=${HEAD_SHA} REF=${GITHUB_REF}"
          if [ "${HEAD_SHA}" != "${GITHUB_SHA}" ]; then
            echo "::error::检出 commit ${HEAD_SHA} 与触发 commit ${GITHUB_SHA} 不一致"
            exit 1
          fi
          {
            echo "### Build provenance"
            echo "- commit: \`${HEAD_SHA}\`"
            echo "- ref: \`${GITHUB_REF}\`"
            echo "- run: \`${GITHUB_RUN_ID}\` / attempt \`${GITHUB_RUN_ATTEMPT}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          large-packages: true
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          # 保留 swap：关闭后内存不足会被内核静默 OOM kill，日志无痕迹。
          swap-storage: false
          # 保留 /opt/hostedtoolcache：本流程未用 setup-*，删它收益有限，
          # 却会让后续引入 setup-node/setup-python 时重新下载或找不到固定版本。
          preinstalled-runtimes: false

      - name: Detect runner image and cache epoch
        id: runner_image
        run: |
          . /etc/os-release
          echo "tag=${VERSION_ID}" >> "${GITHUB_OUTPUT}"
          # dl 内容只增不减、而缓存 key 不可覆盖：不换代就会永远停在
          # 第一次保存的那批源码包上，之后新增的每次都要重下。
          # 按月换代 = 自动刷新 + 缓存自然过期，无需手工清缓存。
          echo "epoch=$(date -u +%Y%m)" >> "${GITHUB_OUTPUT}"

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ${{ runner.os }}-owrt-ccache-${{ steps.runner_image.outputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-owrt-ccache-${{ steps.runner_image.outputs.tag }}-

      - name: Restore downloads
        id: restore_dl
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dl
          key: ${{ runner.os }}-owrt-dl-${{ steps.runner_image.outputs.tag }}-${{ steps.runner_image.outputs.epoch }}-${{ hashFiles('config.seed', 'feeds.conf.default') }}
          restore-keys: |
            ${{ runner.os }}-owrt-dl-${{ steps.runner_image.outputs.tag }}-

      - name: Drop stale go module cache
        run: |
          rm -rf dl/go-mod-cache
          echo "dl/go-mod-cache 已清空，将由 make download 重新拉取"

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt update
          BUILD_DEPS="ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz msmtp ninja-build 7zip patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev"
          # 新镜像与旧镜像的包集合差异较大：先报出不可用的依赖，
          # 避免一条长 apt install 失败后才逐个排查。
          MISSING_DEPS=""
          for p in ${BUILD_DEPS}; do
            apt-cache show "$p" > /dev/null 2>&1 || MISSING_DEPS="${MISSING_DEPS} ${p}"
          done
          if [ -n "${MISSING_DEPS}" ]; then
            echo "::warning::当前镜像缺少以下依赖:${MISSING_DEPS}"
          fi
          sudo -E apt -y install ${BUILD_DEPS}
          sudo -E apt -y autoremove --purge
          sudo -E apt clean
          df -hT

      - name: Report disk budget。
        run: |
          AVAIL_GB=$(df -BG --output=avail / | tail -n 1 | tr -dc '0-9')
          echo "Available before build: ${AVAIL_GB} GiB"
          echo "### Disk budget" >> "${GITHUB_STEP_SUMMARY}"
          echo "Available before build: ${AVAIL_GB} GiB" >> "${GITHUB_STEP_SUMMARY}"
          if [ "${AVAIL_GB}" -lt 12 ]; then
            echo "::warning::可用磁盘仅 ${AVAIL_GB} GiB（建议 >= 12 GiB）。若编译报 No space left on device，请在 Initialization environment 补清理项，不要把 hugoalh 加回来。"
          fi

      - name: Update feeds
        run: |
          #sed -i 's/#src-git helloworld/src-git helloworld/g' ./feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Record feed revisions
        run: |
          {
            echo "### Feed revisions"
            echo ""
            echo "| feed | commit |"
            echo "| --- | --- |"
            for dir in feeds/*/; do
              name=$(basename "${dir}")
              commit=$(git -C "${dir}" rev-parse --short=12 HEAD 2>/dev/null || echo 'n/a')
              echo "| ${name} | \`${commit}\` |"
            done
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "=== feed revisions ==="
          for dir in feeds/*/; do
            printf '%-20s %s\n' "$(basename "${dir}")" \
              "$(git -C "${dir}" rev-parse --short=12 HEAD 2>/dev/null || echo n/a)"
          done

      - name: Get new themes and applications
        run: |
          rm -rf package/feeds/luci/luci-theme-argon
          rm -rf package/feeds/luci/luci-app-argon-config
          rm -rf package/feeds/luci/luci-theme-infinityfreedom
          rm -rf package/feeds/luci/luci-app-unblockneteasemusic
          git clone --depth 1 https://github.com/xiaoqingfengATGH/luci-theme-infinityfreedom.git package/feeds/luci/luci-theme-infinityfreedom
          git clone --depth 1 -b master https://github.com/jerrykuku/luci-theme-argon.git package/feeds/luci/luci-theme-argon
          git clone --depth 1 -b master https://github.com/jerrykuku/luci-app-argon-config.git package/feeds/luci/luci-app-argon-config
          git clone --depth 1 https://github.com/derisamedia/luci-theme-alpha package/feeds/luci/luci-theme-alpha
          git clone --depth 1 https://github.com/derisamedia/luci-app-alpha-config package/feeds/luci/luci-app-alpha-config
          git clone --depth 1 -b master https://github.com/sirpdboy/luci-theme-kucat package/feeds/luci/luci-theme-kucat
          git clone --depth 1 https://github.com/sirpdboy/luci-app-kucat-config package/feeds/luci/luci-app-kucat-config
          git clone --depth 1 https://github.com/EasyTier/luci-app-easytier package/feeds/luci/luci-app-easytier
          git clone --depth 1 https://github.com/zzsj0928/luci-app-pushbot package/feeds/luci/luci-app-pushbot
          git clone --depth 1 https://github.com/UnblockNeteaseMusic/luci-app-unblockneteasemusic package/feeds/luci/luci-app-unblockneteasemusic


      - name: Load build config
        run: |
          cp config.seed .config
          make defconfig
          # ccache 由 config.seed 里的 CONFIG_DEVEL=y + CONFIG_CCACHE=y 原生启用。
          # config/Config-devel.in:135 的写法是 `bool "Use ccache" if DEVEL`：
          # 该 if 只作用于 prompt（可见性），DEVEL=n 时符号不可见，
          # defconfig 会把 .config 里的值丢掉（已实测）；事后再 append 同样无效 ——
          # make 重新处理配置时还会被清掉。DEVEL=y 让符号可见，值才真正保留。
          #
          # 这是加速开关，不是正确性前提：未生效只告警，绝不让构建失败。
          if grep -q '^CONFIG_CCACHE=y' .config; then
            echo "ccache: enabled (CONFIG_CCACHE=y 已由 defconfig 保留)"
          else
            echo "::warning::CONFIG_CCACHE 未在 defconfig 后保留，本次不使用 ccache（仅影响耗时，不影响产物）"
            {
              echo "### ccache"
              echo "未启用：CONFIG_CCACHE 未在 defconfig 后保留，仅影响构建耗时。"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          if command -v ccache > /dev/null; then
            ccache --version | head -n 1
          else
            echo "::warning::未找到 ccache 二进制，本次不使用 ccache（仅影响耗时，不影响产物）"
          fi
          # 检测 config.seed 里写了 =y、但 defconfig 后未生效的符号：
          # 未知符号 / 包名写错 / 依赖不满足都会被 Kconfig 静默丢弃且不报错，
          # 这里把差集暴露到日志与 run summary，避免"配了却没生效"。
          # 正则需含连字符：OpenWrt 的 CONFIG_PACKAGE_luci-app-... 保留了 '-'。
          MISSING=$(comm -23 \
            <(grep -E '^CONFIG_[A-Za-z0-9_-]+=y$' config.seed | cut -d= -f1 | sort -u) \
            <(grep -E '^CONFIG_[A-Za-z0-9_-]+=' .config | cut -d= -f1 | sort -u))
          if [ -n "${MISSING}" ]; then
            echo "::warning::config.seed 中以下 =y 符号在 defconfig 后未生效："
            while IFS= read -r sym; do
              [ -z "${sym}" ] && continue
              actual=$(grep -m1 -E "^# ${sym} is not set$|^${sym}=" .config || true)
              if [ -n "${actual}" ]; then
                echo "  ${sym} -> ${actual}  (被 defconfig 关闭)"
              else
                echo "  ${sym} -> 当前源码树中不存在该符号（可能已废弃或改名）"
              fi
            done <<< "${MISSING}"
            {
              echo "### 未生效的配置符号"
              echo '```'
              echo "${MISSING}"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "All config.seed symbols survived defconfig"
          fi

      - name: Make download
        id: download
        run: |
          # 并行度与 CPU 核数挂钩（上限 8），避免固定 -j8 在不同规格 runner 上失衡。
          DOWNLOAD_JOBS=$(( $(nproc) > 8 ? 8 : $(nproc) ))
          echo "Downloading with -j${DOWNLOAD_JOBS}"
          make download -j"${DOWNLOAD_JOBS}" || make download -j1 V=s
          # 小于 1KB 的文件通常是下载失败的残片：清理后立即补下一次，
          # 而不是留到编译阶段才发现缺包。
          find dl -type f -size -1024c -delete
          make download -j"${DOWNLOAD_JOBS}" || echo "::warning::部分源码包可能未就绪，编译阶段将按需重试"

      - name: Compile firmware
        id: compile
        run: |
          # 并行度封顶 4：部分包单进程内存占用可达数 GB，
          # 拉满 nproc 容易触发内存压力；失败后再单线程重跑以保留详细日志。
          BUILD_JOBS=$(( $(nproc) > 4 ? 4 : $(nproc) ))
          echo "Building with -j${BUILD_JOBS} ($(nproc) CPUs available)"
          set -o pipefail
          make -j"${BUILD_JOBS}" 2>&1 | tee build.log || make -j1 V=s 2>&1 | tee -a build.log
          echo "======================="
          echo "Space usage:"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1 ./ --exclude=build_dir --exclude=bin
          du -h --max-depth=1 ./build_dir
          du -h --max-depth=1 ./bin

      - name: Report ccache statistics
        if: always()
        run: |
          echo "=== ccache statistics ==="
          ccache -s || true
          if [ -d "${CCACHE_DIR}" ] && [ -n "$(ls -A "${CCACHE_DIR}" 2>/dev/null)" ]; then
            echo "ccache storage: non-empty ($(du -sh "${CCACHE_DIR}" 2>/dev/null | cut -f1))"
          else
            echo "::warning::ccache 目录为空 —— 本次编译未经过 ccache（仅影响耗时，不影响产物）"
          fi

      - name: Prepare artifact
        run: |
          mkdir -p ./artifact/package ./artifact/buildinfo
          find ./bin/targets/ -type d -name "packages" -prune -exec rm -rf {} \;
          find ./bin/packages/ -type f -name "*.ipk" -exec cp -t ./artifact/package/ {} +
          find ./bin/targets/ -type f \( -name "*.buildinfo" -o -name "*.manifest" \) -exec cp -t ./artifact/buildinfo/ {} +

      - name: Upload buildinfo
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenWrt_buildinfo
          path: ./artifact/buildinfo/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenWrt_package
          path: ./artifact/package/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9

      - name: Upload firmware
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenWrt_firmware
          # 有意保留完整 bin/targets/：publish_release 依赖平铺后的完整文件集；
          # .buildinfo/.manifest 体积极小但保留可追溯性，排除收益不足。
          path: ./bin/targets/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      - name: Diagnose build failure
        if: failure() || cancelled()
        run: |
          echo "=== memory / OOM evidence ==="
          free -h || true
          if [ -r /sys/fs/cgroup/memory.events ]; then
            cat /sys/fs/cgroup/memory.events
          else
            echo "memory.events unavailable"
          fi
          echo "=== disk ==="
          df -hT || true
          echo "=== largest build dirs ==="
          du -h --max-depth=1 ./build_dir 2>/dev/null | sort -h | tail -n 15 || true

      - name: Upload build log
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenWrt_buildlog
          path: build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Drop stale go module cache before saving
        if: always()
        run: rm -rf dl/go-mod-cache

      - name: Save downloads
        if: always() && steps.download.outcome != 'skipped' && steps.restore_dl.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dl
          # 必须与 Restore downloads 的 key 逐字一致；dry-run 会静态核对这一点。
          key: ${{ runner.os }}-owrt-dl-${{ steps.runner_image.outputs.tag }}-${{ steps.runner_image.outputs.epoch }}-${{ hashFiles('config.seed', 'feeds.conf.default') }}

      - name: Save ccache
        # 滚动 key 含 run_id + run_attempt：同一 run 的「重跑」run_id 不变，
        # 只带 run_id 会在重跑时撞上已有条目，增量就存不进去了。
        if: always() && steps.compile.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ${{ runner.os }}-owrt-ccache-${{ steps.runner_image.outputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}


  publish_release:
    name: Publish firmware to Release
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build_openwrt
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # gh CLI 需要显式 token。
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 两个来源分开命名，再由 Resolve release tag 归一化成 RELEASE_TAG。
      # 不在表达式里写 `a && b || c` 当三元用：空串/null 的类型强制转换
      # 会让它在中段取值时静默走错分支。
      EVENT_TAG: ${{ github.event.release.tag_name }}
      INPUT_TAG: ${{ inputs.release_tag }}
      INPUT_PRERELEASE: ${{ inputs.prerelease }}
      # 本次被构建的 commit。tag 必须落在它上面 —— 这是产物与 tag 对应的唯一基准。
      BUILT_SHA: ${{ github.sha }}

    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OpenWrt_firmware
          path: ./firmware

      - name: Flatten firmware files
        # artifact 保留 bin/targets/<target>/<subtarget>/ 目录结构，
        # 而 file_glob 只匹配单层，故先平铺到 release-assets/。
        run: |
          mkdir -p ./release-assets
          find ./firmware -type f -exec cp -t ./release-assets/ {} +

      - name: Resolve release tag
        # 归一化 tag 来源并做字符集校验：该值会进入 git ref 与 gh 命令，
        # 只接受 [A-Za-z0-9][A-Za-z0-9._-]*，排除 /、前导 . -、以及 .. 段。
        run: |
          set -euo pipefail
          TAG="${EVENT_TAG:-}"
          if [ -z "${TAG}" ]; then TAG="${INPUT_TAG:-}"; fi
          if [ -z "${TAG}" ]; then
            echo "::error::既无 release 事件的 tag，也未提供 release_tag 输入"; exit 1
          fi
          case "${TAG}" in
            */*|.*|-*|*..*)
              echo "::error::release_tag 非法：${TAG}（只允许字母数字与 . _ -，不得含 / 或以 . - 开头）"
              exit 1 ;;
          esac
          if ! printf '%s' "${TAG}" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*$'; then
            echo "::error::release_tag 含非法字符：${TAG}"; exit 1
          fi
          echo "RELEASE_TAG=${TAG}" >> "${GITHUB_ENV}"
          echo "Tag=${TAG} ; built commit=${BUILT_SHA} ; event=${GITHUB_EVENT_NAME}"

      - name: Create release and tag at built commit
        # 仅自动路径（dispatch）执行；release 事件路径下 release 已存在，无需创建。
        if: github.event_name == 'workflow_dispatch'
        # tag 指向 ${BUILT_SHA}，不是 master：编译要 2 小时以上，期间 master 可能已前进，
        # 指向 master 会让「tag 名」与「实际源码」错位。这是本步骤存在的全部理由。
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          NOTES=$(printf 'Automated build.\n\n- commit: %s\n- run: %s/%s/actions/runs/%s' \
                  "${BUILT_SHA}" "${GITHUB_SERVER_URL}" "${REPO}" "${GITHUB_RUN_ID}")
          ARGS=()
          if [ "${INPUT_PRERELEASE:-false}" = "true" ]; then ARGS+=(--prerelease); fi

          if gh release view "${RELEASE_TAG}" --repo "${REPO}" > /dev/null 2>&1; then
            # 重跑同一次 dispatch 时 release 已存在：不重建，交给后面的校验与覆盖上传。
            echo "release ${RELEASE_TAG} 已存在，跳过创建"
          elif gh api "repos/${REPO}/git/ref/tags/${RELEASE_TAG}" > /dev/null 2>&1; then
            # tag 已存在但没有 release：复用它，绝不移动。移动 tag 会让已下载旧产物的人
            # 拿到对不上的源码；若它指向别的 commit，由下一步硬拦截，而不是悄悄改指向。
            echo "tag ${RELEASE_TAG} 已存在，复用且不移动"
            gh release create "${RELEASE_TAG}" --repo "${REPO}" \
              --title "${RELEASE_TAG}" --notes "${NOTES}" "${ARGS[@]}"
          else
            gh release create "${RELEASE_TAG}" --repo "${REPO}" \
              --target "${BUILT_SHA}" \
              --title "${RELEASE_TAG}" --notes "${NOTES}" "${ARGS[@]}"
          fi
          echo "### Release 自动创建" >> "${GITHUB_STEP_SUMMARY}"
          echo "- tag: \`${RELEASE_TAG}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- target commit: \`${BUILT_SHA}\`" >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify tag points at built commit
        # 发布链路唯一的硬一致性约束：release 的 tag 必须指向本次构建的 commit。
        # 不一致 = 挂着 vX.Y.Z 的名字卖别的源码产的固件，比发不出去严重得多，
        # 因此在任何资产写入之前终止（含手建 release 的路径）。
        run: |
          set -euo pipefail
          TAG_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq '.sha')
          if [ "${TAG_SHA}" != "${BUILT_SHA}" ]; then
            echo "::error::tag ${RELEASE_TAG} 指向 ${TAG_SHA}，本次构建的是 ${BUILT_SHA}；产物与 tag 不对应，已拒绝上传"
            exit 1
          fi
          echo "tag ↔ commit 一致：${RELEASE_TAG} -> ${TAG_SHA}"
          echo "Tag commit: ${TAG_SHA}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate release context
        # 把静默失败变成带定位信息的显式失败：
        # tag 非空、release 真实存在、待上传文件非空。
        # 自动路径下前一步刚建过 release，这里同时起到「创建确实生效」的作用。
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TAG}" ]; then
            echo "::error::RELEASE_TAG 为空，事件上下文不是 release 且未提供 release_tag"; exit 1
          fi
          if ! gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json tagName > /dev/null; then
            echo "::error::找不到 release ${RELEASE_TAG}"; exit 1
          fi
          FILE_COUNT=$(find ./release-assets -type f | wc -l)
          if [ "${FILE_COUNT}" -eq 0 ]; then
            echo "::error::artifact 展开后无文件可上传"; exit 1
          fi
          echo "Tag: ${RELEASE_TAG} ; files to upload: ${FILE_COUNT}"
          echo "### Release publish" >> "${GITHUB_STEP_SUMMARY}"
          echo "Tag: ${RELEASE_TAG} ; files: ${FILE_COUNT}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload release asset
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          # 内置 GITHUB_TOKEN 即可，无需自建 PAT。
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./release-assets/*
          # 用归一化后的 RELEASE_TAG（两条入口共用），不再直接取事件字段。
          tag: ${{ env.RELEASE_TAG }}
          file_glob: true
          # 必须显式开启：该 action 的 check_duplicates 默认为 true，
          # 而 overwrite 默认 false —— 同名资产已存在时它调的是 core.setFailed，
          # 即「重发同一个 tag 直接失败」。开 overwrite 后变为先删旧资产再传，
          # 重发布才是幂等的（固件已上线后修正配置重发是常态）。
          overwrite: true

      - name: Verify uploaded assets
        run: |
          set -euo pipefail
          read -r COUNT DRAFT <<< "$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --json assets,isDraft --jq '"\(.assets | length) \(.isDraft)"')"
          if [ "${COUNT}" -eq 0 ]; then
            echo "::error::release ${RELEASE_TAG} 中没有资产，上传未生效"; exit 1
          fi
          LOCAL=$(find ./release-assets -type f | wc -l)
          if [ "${COUNT}" -lt "${LOCAL}" ]; then
            echo "::error::release 只有 ${COUNT} 个资产，本地待传 ${LOCAL} 个；上传不完整"; exit 1
          fi
          echo "Verified ${COUNT} asset(s) on release ${RELEASE_TAG} (local ${LOCAL}, draft=${DRAFT})"
          {
            echo "- assets: \`${COUNT}\`"
            echo "- draft: \`${DRAFT}\`"
            echo "- url: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          } >> "${GITHUB_STEP_SUMMARY}"
