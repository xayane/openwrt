# Release 发布链路演练：不创建、不修改任何 release / tag / artifact，
# 也不触发 OpenWrt 全量编译。
# 应放置于仓库 .github/workflows/release-dryrun.yml
name: Release publish dry-run

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: '取回 OpenWrt_firmware 的已成功构建 run ID'
        required: true
        type: string
        default: '42364311687'
      release_tag:
        description: '演练用的 tag 名（仅用于日志，不会创建 tag）'
        required: true
        type: string
        default: 'ci-dryrun'

# 全程只读：不授予 contents: write。
permissions:
  contents: read
  actions: read

concurrency:
  group: release-dryrun
  cancel-in-progress: false

jobs:
  dry_run_publish:
    name: Dry-run firmware publish pipeline
    # 演练对象是 publish_release 那一段（下载 → 平铺 → 校验），它不编译；
    # 因此镜像与被演练方保持一致：publish_release 用 ubuntu-latest，这里也用。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Static self-check of main workflow
        # 一次性核对主链路的关键加固项与共享命令；主 workflow 改动后此处会失败提醒同步。
        run: |
          set -euo pipefail
          MAIN=.github/workflows/openwrt-ci.yml
          for cmd in \
            'name: OpenWrt_firmware' \
            'find ./firmware -type f -exec cp -t ./release-assets/ {} +' \
            'FILE_COUNT=$(find ./release-assets -type f | wc -l)' \
            "if: github.event_name == 'release'" \
            'swap-storage: false' \
            'large-packages: true' \
            'Report disk budget' \
            'Diagnose build failure'; do
            grep -Fq "$cmd" "$MAIN" || {
              echo "::error::主 workflow 缺少 [$cmd]，请同步 dry-run"; exit 1
            }
          done
          for bad in 'YOURTOKEN' "github.event == 'release'" 'artifact/firmware'; do
            ! grep -Fq "$bad" "$MAIN" || {
              echo "::error::主 workflow 仍存在 [$bad]"; exit 1
            }
          done
          # 提取行号必须容错：grep 无匹配返回 1，配合 set -o pipefail 会让脚本
          # 在打印错误信息之前就中止，失败原因反而变得不可读。
          CLEAN_LINE=$(grep -n -F -- '- name: Free Disk Space (Ubuntu)' "$MAIN" | head -n 1 | cut -d: -f1 || true)
          INIT_LINE=$(grep -n -F -- '- name: Initialization environment' "$MAIN" | head -n 1 | cut -d: -f1 || true)
          if [ -z "$CLEAN_LINE" ] || [ -z "$INIT_LINE" ] || [ "$CLEAN_LINE" -ge "$INIT_LINE" ]; then
            echo "::error::磁盘清理步骤缺失或晚于依赖安装（clean=$CLEAN_LINE init=$INIT_LINE）：large-packages 会删掉刚装的 llvm/clang"
            exit 1
          fi

          # 缓存只是加速手段，不得成为构建门禁。
          if grep -Fq 'ccache 未能启用，构建中止' "$MAIN"; then
            echo "::error::主 workflow 仍把 ccache 当门禁：缓存失效不应导致构建失败"; exit 1
          fi
          # dl 缓存的 restore/save key 必须逐字一致，否则只能读、永远写不进去。
          RKEY=$(grep -A20 -F -- '- name: Restore downloads' "$MAIN" \
                 | grep -F 'key:' | head -n 1 | sed 's/^ *//' || true)
          SKEY=$(grep -A20 -F -- '- name: Save downloads' "$MAIN" \
                 | grep -F 'key:' | head -n 1 | sed 's/^ *//' || true)
          if [ -z "$RKEY" ] || [ -z "$SKEY" ] || [ "$RKEY" != "$SKEY" ]; then
            echo "::error::dl 缓存 restore/save key 不一致：[$RKEY] vs [$SKEY]"; exit 1
          fi
          # 精确命中后必须跳过保存：缓存不可覆盖，重复 save 只是白传上 GB 数据。
          grep -A20 -F -- '- name: Save downloads' "$MAIN" \
            | grep -Fq "steps.restore_dl.outputs.cache-hit != 'true'" || {
            echo "::error::Save downloads 缺少 cache-hit 守卫，命中时仍会重复上传整份 dl"; exit 1
          }
          # go-mod-cache 必须在下载前剔除，否则跨 feed 漂移会让 Go 包编译失败。
          PURGE_LINE=$(grep -n -F 'rm -rf dl/go-mod-cache' "$MAIN" | head -n 1 | cut -d: -f1 || true)
          DL_LINE=$(grep -n -F -- '- name: Make download' "$MAIN" | cut -d: -f1)
          if [ -z "$PURGE_LINE" ] || [ -z "$DL_LINE" ] || [ "$PURGE_LINE" -ge "$DL_LINE" ]; then
            echo "::error::dl/go-mod-cache 未在 Make download 之前清空（purge=$PURGE_LINE download=$DL_LINE）"; exit 1
          fi
          # ccache 能否生效取决于 config.seed 里这两个符号。
          grep -Fq 'CONFIG_DEVEL=y' config.seed || {
            echo "::error::config.seed 缺少 CONFIG_DEVEL=y，ccache 会被 defconfig 丢弃"; exit 1
          }
          grep -Fq 'CONFIG_CCACHE=y' config.seed || {
            echo "::error::config.seed 缺少 CONFIG_CCACHE=y"; exit 1
          }

          echo "Static self-check OK"

      - name: Download firmware artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OpenWrt_firmware
          path: ./firmware
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # 跨 run 下载需 actions:read；若报 403，改用具备该权限的 PAT。

      - name: Flatten firmware files
        run: |
          set -euo pipefail
          mkdir -p ./release-assets
          find ./firmware -type f -exec cp -t ./release-assets/ {} +

      - name: Validate release context
        # 与主链路同名步骤共享校验逻辑；dry-run 不调用 Release API 写入。
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TAG}" ]; then
            echo "::error::RELEASE_TAG 为空"; exit 1
          fi
          FILE_COUNT=$(find ./release-assets -type f | wc -l)
          if [ "${FILE_COUNT}" -eq 0 ]; then
            echo "::error::artifact 展开后无文件可上传"; exit 1
          fi
          echo "Tag: ${RELEASE_TAG} ; files: ${FILE_COUNT}"
          echo "### Release dry-run" >> "${GITHUB_STEP_SUMMARY}"
          echo "Source run: ${SOURCE_RUN_ID}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Tag: ${RELEASE_TAG}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Assets that WOULD be uploaded: ${FILE_COUNT}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Dry-run asset manifest
        # 只列清单，不上传；验证 file_glob 能匹配到的文件名与数量。
        run: |
          set -euo pipefail
          echo "=== assets (no upload performed) ==="
          find ./release-assets -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          echo "=== token capability (read-only probe) ==="
          gh api "repos/${GITHUB_REPOSITORY}" --jq '.permissions' || true
          echo "DRY-RUN COMPLETE: 未创建、未修改任何 release / tag / artifact"
